<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <title>Öğrenci Oyunları</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{
      --bg:#f7f7f7; --ink:#111; --muted:#6b7280; --card:#fff; --line:#e5e7eb; --hover:#e6f4ff;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
    header{padding:28px 16px;text-align:center}
    h1{margin:0 0 6px 0}
    p.sub{margin:0;color:var(--muted);font-size:14px}
    .wrap{max-width:980px;margin:0 auto;padding:0 16px 36px}
    .grid{
      display:grid;
      grid-template-columns: repeat(auto-fill,minmax(180px,1fr));
      gap:16px;
    }
    a.card{
      display:block;background:var(--card);border:1px solid var(--line);
      border-radius:14px; text-decoration:none; color:inherit;
      transition:transform .08s ease, box-shadow .08s ease, background-color .2s ease;
      box-shadow:0 1px 0 rgba(0,0,0,.03);
    }
    a.card:hover{transform:translateY(-2px); box-shadow:0 10px 18px rgba(0,0,0,.06); background:var(--hover)}
    .thumb{
      position:relative; width:100%; aspect-ratio:1/1; overflow:hidden;
      border-bottom:1px solid var(--line); background:#fafafa;
      display:flex; align-items:center; justify-content:center;
      font-size:42px;
    }
    .thumb img{width:100%; height:100%; object-fit:cover; display:block}
    .thumb.placeholder::after{content:attr(data-emoji);}
    .card-body{padding:10px 12px}
    .title{font-weight:700; font-size:15px; margin:0 0 4px}
    .meta{font-size:12px; color:var(--muted); margin:0}
    footer{padding:18px 16px; text-align:center; color:var(--muted); font-size:12px}
  </style>
</head>
<body>
  <header>
    <h1>🎮 Oyunlar</h1>
    <p class="sub">Kapak görseli yoksa otomatik emoji görünür. Karta tıklayarak oyunu aç.</p>
  </header>

  <div class="wrap">
    <div class="grid">

      <!-- KART: Mayın Tarlası -->
      <a class="card" href="mayin-tarlasi/">
        <div class="thumb" data-emoji="💣">
          <img src="mayin-tarlasi/cover.jpg" alt="Mayın Tarlası kapak" onerror="this.style.display='none'; this.parentNode.classList.add('placeholder')">
        </div>
        <div class="card-body">
          <p class="title">Mayın Tarlası</p>
          <p class="meta">9×9 • 10 mayın</p>
        </div>
      </a>

      <!-- KART: Sudoku -->
      <a class="card" href="sudoku/">
        <div class="thumb" data-emoji="🧩">
          <img src="sudoku/cover.jpg" alt="Sudoku kapak" onerror="this.style.display='none'; this.parentNode.classList.add('placeholder')">
        </div>
        <div class="card-body">
          <p class="title">Sudoku</p>
          <p class="meta">Mini 4×4 • Başlangıç</p>
        </div>
      </a>

      <a class="card" href="hafıza-oyunu/hafıza.html">
        <div class="thumb" data-emoji="🎯">
          <img src="hafıza-oyunu/" alt="Oyun adı kapak" onerror="this.style.display='none'; this.parentNode.classList.add('placeholder')">
        </div>
        <div class="card-body">
          <p class="title">Hafıza</p>
          <p class="meta">Ezberle</p>
        </div>
      </a>
      <!-- ÖRNEK: ileride yeni oyun eklersen şablon -->
      <!--
      <a class="card" href="oyun-adi/">
        <div class="thumb" data-emoji="🎯">
          <img src="oyun-adi/cover.png" alt="Oyun adı kapak" onerror="this.style.display='none'; this.parentNode.classList.add('placeholder')">
        </div>
        <div class="card-body">
          <p class="title">Oyun Adı</p>
          <p class="meta">Kısa açıklama</p>
        </div>
      </a>
      -->

    </div>
  </div>

  <footer>© 2025 Öğrenci Oyunları</footer>
</body>
</html>

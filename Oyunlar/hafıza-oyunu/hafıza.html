<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hafıza Oyunu</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a22; --line:#233046; --ink:#e7edf5; --muted:#9aa7bd;
    --card:#101824; --card2:#0d1724; --ok:#39d98a; --bad:#ff6b6b; --accent:#6ee7ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Segoe UI,Roboto,Arial}
  header{padding:14px 16px;border-bottom:1px solid var(--line);background:#10151d}
  h1{font-size:18px;margin:0}
  main{max-width:820px;margin:18px auto;padding:0 16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 12px 18px}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
  .toolbar>*{background:#0f1726;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:14px}
  .toolbar button{cursor:pointer}
  .toolbar button:hover{border-color:#3a4660}
  .stats{margin-left:auto;display:flex;gap:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  #grid{display:grid;gap:10px;justify-content:center}
  .card{
    width:90px;height:110px;position:relative;cursor:pointer;perspective:800px;
    user-select:none;
  }
  /* Eşleşen kartlar için renk / vurgu */
.face{
  /* yumuşak geçiş olsun */
  transition: background-color .25s ease, box-shadow .25s ease, color .25s ease;
}
.matched .inner{
  border-color: #2bb673;               /* yeşil çerçeve */
  filter: none;                         /* mevcut saturate yerine düz */
}
.matched .back{
  background: linear-gradient(155deg, #103725, #0b281f); /* yeşil tonları */
  color: #9ff7c9;                                        /* yazı/emoji rengi */
  box-shadow: 0 0 0 2px rgba(43,182,115,.35) inset, 0 6px 16px rgba(0,0,0,.35);
}
.matched{
  animation: card-pop .22s ease;        /* hafif pop efekti */
}
@keyframes card-pop{
  from{ transform: scale(.98); }
  to{ transform: scale(1); }
}

  .inner{
    position:absolute;inset:0;border-radius:12px;border:1px solid var(--line);
    transition:transform .35s ease; transform-style:preserve-3d;
  }
  .face{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;border-radius:12px;font-size:44px;
  }
  .front{background:linear-gradient(155deg,var(--card),var(--card2))}
  .back{transform:rotateY(180deg);background:#0f1b2a}
  .flipped .inner{transform:rotateY(180deg)}
  .matched .inner{transform:rotateY(180deg); filter:saturate(1.3)}
  .msg{margin-top:10px;color:var(--muted)}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  @media (max-width:540px){
    .card{width:70px;height:90px}
    .face{font-size:36px}
  }
</style>
</head>
<body>
<header><h1>🧠 Hafıza Oyunu</h1></header>
<main>
  <div class="panel">
    <div class="toolbar">
      <button id="newBtn">Yeni Oyun</button>
      <label>Boyut:
        <select id="sizeSel">
          <option value="4x4">4×4 (16 kart)</option>
          <option value="6x4">6×4 (24 kart)</option>
        </select>
      </label>
      <div class="stats">
        <div>⏱️ <span id="time">0</span>s</div>
        <div>🎯 Hamle: <span id="moves">0</span></div>
        <div>✅ Eş: <span id="pairs">0</span></div>
      </div>
    </div>
    <div id="grid" aria-label="Hafıza kartları"></div>
    <div id="msg" class="msg">Aynı sembolleri eşleştir. İlk tıkta süre başlar.</div>
  </div>
</main>

<script>
(function(){
  const EMOJIS = ["🍎","🍊","🍋","🍉","🍇","🍓","🍒","🍑","🥝","🥑",
                  "🌙","⭐","☀️","🪐","⚡","🔥","❄️","🌈","🌸","🍀",
                  "⚽","🏀","🎲","🎧","🚗","✈️","🎈","🎁","🐶","🐱"];
  let rows=4, cols=4;
  let first, lock=false, moves=0, pairs=0, totalPairs=0;
  let time=0, timerId=null, started=false;

  const grid = document.getElementById('grid');
  const timeEl = document.getElementById('time');
  const movesEl = document.getElementById('moves');
  const pairsEl = document.getElementById('pairs');
  const msgEl = document.getElementById('msg');
  const newBtn = document.getElementById('newBtn');
  const sizeSel = document.getElementById('sizeSel');

  function msg(t, cls=''){ msgEl.className='msg '+cls; msgEl.textContent=t; }

  function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a; }

  function build(){
    started=false; clearInterval(timerId); time=0; timeEl.textContent='0';
    moves=0; pairs=0; movesEl.textContent='0'; pairsEl.textContent='0';
    first=null; lock=false;

    // grid ölçüsü
    grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

    // kartlar
    const count = rows*cols;
    totalPairs = count/2;
    const picks = EMOJIS.slice(0, totalPairs);
    const cards = shuffle(picks.concat(picks)).map((emoji, idx)=>{
      const el = document.createElement('div');
      el.className='card'; el.setAttribute('role','button'); el.setAttribute('aria-label','kart');
      el.dataset.emoji = emoji;

      el.innerHTML = `
        <div class="inner">
          <div class="face front">🎴</div>
          <div class="face back">${emoji}</div>
        </div>
      `;

      el.addEventListener('click', ()=>{
        if(lock || el.classList.contains('flipped') || el.classList.contains('matched')) return;
        if(!started){ started=true; timerId=setInterval(()=>{ time++; timeEl.textContent=String(time); }, 1000); }

        el.classList.add('flipped');
        if(!first){ first = el; return; }

        // ikinci seçim
        moves++; movesEl.textContent = String(moves);
        const same = first.dataset.emoji === el.dataset.emoji;
        if(same){
          // eşleşti
          setTimeout(()=>{
            first.classList.add('matched');
            el.classList.add('matched');
            first = null; pairs++; pairsEl.textContent=String(pairs);
            if(pairs === totalPairs){
              clearInterval(timerId);
              msg(`🎉 Tebrikler! ${moves} hamlede, ${time} saniyede tamamladın.`, 'ok');
            }
          }, 120);
        }else{
          // aç-kapat
          lock = true;
          setTimeout(()=>{
            first.classList.remove('flipped');
            el.classList.remove('flipped');
            first = null; lock = false;
          }, 700);
        }
      });

      return el;
    });

    // yerleştir
    grid.innerHTML='';
    cards.forEach(c=>grid.appendChild(c));
    msg('Aynı sembolleri eşleştir. İlk tıkta süre başlar.');
  }

  function setSize(v){
    const [c,r] = v.split('x').map(Number); // select 4x4 => cols x rows algılama
    cols=c; rows=r;
  }

  newBtn.onclick = ()=> build();
  sizeSel.onchange = ()=> { setSize(sizeSel.value); build(); };

  // başlangıç
  setSize(sizeSel.value);
  build();
})();
</script>
</body>
</html>
